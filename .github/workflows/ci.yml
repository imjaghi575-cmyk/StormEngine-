name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Validate CMake presets
        shell: bash
        run: |
          set -euo pipefail
          cmake --list-presets
          ctest --help >/dev/null

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            preset=debug
          else
            preset=release
          fi
          cmake --preset "${preset}" -DSTORM_ENABLE_WARNINGS=ON

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            preset=debug
          else
            preset=release
          fi
          cmake --build --preset "${preset}" --parallel

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            preset=debug
          else
            preset=release
          fi
          ctest --preset "${preset}"

  install-package:
    name: GCC / CMake install package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSTORM_BUILD_DEMO=OFF \
            -DSTORM_BUILD_TESTS=OFF \
            -DSTORM_BUILD_INSTALL=ON

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-package --parallel

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build-package --prefix "$PWD/stage"

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail
          test -f stage/lib/cmake/StormEngine/StormEngineConfig.cmake
          test -f stage/lib/cmake/StormEngine/StormEngineTargets.cmake
          cmake -S tests/package_consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel

  sanitizer:
    name: GCC / Address + Undefined Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitized \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DSTORM_BUILD_DEMO=OFF \
            -DSTORM_BUILD_TESTS=ON \
            -DSTORM_ENABLE_WARNINGS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-sanitized --parallel

      - name: Test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -euo pipefail
          ctest --test-dir build-sanitized --output-on-failure --no-tests=error

  android-ndk:
    name: Android NDK / arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install CMake and Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o sdk-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  sdk-tools.zip" | sha256sum -c -
          unzip -q sdk-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Configure Android core
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset android-arm64

      - name: Build Android core
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset android-arm64 --parallel
