name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Validate CMake presets
        shell: bash
        run: |
          set -euo pipefail
          cmake --list-presets
          ctest --help >/dev/null

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            preset=debug
          else
            preset=release
          fi
          cmake --preset "${preset}" -DSTORM_ENABLE_WARNINGS=ON

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            preset=debug
          else
            preset=release
          fi
          cmake --build --preset "${preset}" --parallel

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            preset=debug
          else
            preset=release
          fi
          ctest --preset "${preset}"

  sanitizer:
    name: GCC / Address + Undefined Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-sanitized \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DSTORM_BUILD_DEMO=OFF \
            -DSTORM_BUILD_TESTS=ON \
            -DSTORM_ENABLE_WARNINGS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-sanitized --parallel

      - name: Test
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          set -euo pipefail
          ctest --test-dir build-sanitized --output-on-failure --no-tests=error
